[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scdkit"
version = "0.1.0"
description = "Personal language-processing exam lab for intrinsic style-change detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sapphire Ran" }]
keywords = [
    "stylometry",
    "authorship",
    "style-change-detection",
    "exam",
    "nlp",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
scdkit = "scdkit.cli:main"

[project.urls]
Repository = "https://github.com/sapphireran/Language-Processing-Exam-Style-Change-Detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
