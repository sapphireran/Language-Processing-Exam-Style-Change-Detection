[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kerf"
version = "0.1.0"
description = "Personal exam lab: style-change detection as a change-point cut, not a pairwise hinge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sapphire Ran" }]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kerf = "kerf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
