[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stylechange"
version = "0.1.0"
description = "Personal exam notes and a tiny intrinsic style-change detector (PAN-shaped I/O)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sapphire Ran" }]
keywords = [
    "stylometry",
    "style-change-detection",
    "authorship",
    "nlp",
    "exam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
stylechange = "stylechange.cli:main"

[project.urls]
Homepage = "https://github.com/sapphireran/Language-Processing-Exam-Style-Change-Detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
